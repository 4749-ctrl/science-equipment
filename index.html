<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบยืม-คืนอุปกรณ์วิทยาศาสตร์ | RBAC</title>
    
    <!-- ฟอนต์ Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-borrow: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            --accent-return: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body { 
            font-family: 'Prompt', sans-serif; 
            background: var(--bg-gradient); 
            margin: 0; padding: 40px 20px; color: var(--text-main);
            min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden;
        }

        /* ปุ่ม Admin มุมขวาบน */
        .admin-btn {
            position: absolute; top: 20px; right: 20px;
            background: rgba(255,255,255,0.8); border: none; padding: 10px 15px;
            border-radius: 20px; cursor: pointer; font-family: inherit; font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; z-index: 10;
        }
        .admin-btn:hover { background: #fff; transform: translateY(-2px); }

        .container { 
            max-width: 1100px; width: 100%; display: grid; grid-template-columns: 1fr; gap: 30px; position: relative; z-index: 1;
        }
        @media (min-width: 800px) { .container { grid-template-columns: 420px 1fr; } }

        .card { 
            background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 35px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); border: 2px solid rgba(255,255,255,0.6);
        }

        h2, h3 { text-align: center; font-weight: 700; margin-top: 0; margin-bottom: 25px; }
        h2 { font-size: 1.6rem; color: #ff5e62; }
        h3 { font-size: 1.3rem; color: #4facfe; border-bottom: 3px dashed #cbd5e0; padding-bottom: 15px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.95rem; }
        input[type="text"], select { 
            width: 100%; padding: 14px 18px; border: 2px solid transparent; border-radius: 15px; 
            font-family: inherit; font-size: 1rem; background-color: #fff; box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        input[type="text"]:focus, select:focus { outline: none; border-color: #4facfe; box-shadow: 0 0 0 4px rgba(79, 172, 254, 0.3); }

        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        button.action-btn { 
            flex: 1; padding: 14px; border: none; border-radius: 15px; cursor: pointer; 
            color: white; font-weight: 600; font-family: inherit; font-size: 1.05rem; 
            transition: 0.3s; box-shadow: 0 8px 15px rgba(0,0,0,0.15);
        }
        button.action-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .btn-borrow { background: var(--accent-borrow); }
        .btn-return { background: var(--accent-return); }

        /* ตารางและแท็บ */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .tab-btn { 
            padding: 8px 20px; border: none; border-radius: 20px; font-family: inherit; 
            font-weight: 600; cursor: pointer; background: #e2e8f0; color: var(--text-muted); transition: 0.3s;
        }
        .tab-btn.active { background: #4facfe; color: white; box-shadow: 0 4px 10px rgba(79, 172, 254, 0.4); }

        table { width: 100%; border-collapse: separate; border-spacing: 0 8px; font-size: 0.9em; }
        th, td { padding: 14px 12px; text-align: left; }
        th { color: var(--text-muted); font-weight: 600; font-size: 0.9em; }
        tbody tr { background: #fff; box-shadow: 0 3px 6px rgba(0,0,0,0.02); transition: 0.2s; }
        tbody tr:hover { transform: scale(1.01); }
        td:first-child { border-top-left-radius: 12px; border-bottom-left-radius: 12px; }
        td:last-child { border-top-right-radius: 12px; border-bottom-right-radius: 12px; }

        .badge { padding: 5px 10px; border-radius: 12px; font-size: 0.8em; font-weight: 600; }
        .badge-pending { background: #fef3c7; color: #d97706; }
        .badge-active { background: #d1fae5; color: #059669; }

        /* ปุ่มจัดการของ Admin ในตาราง */
        .admin-controls { display: none; gap: 5px; margin-top: 5px; }
        .admin-controls button { 
            padding: 5px 10px; border: none; border-radius: 8px; font-size: 0.8em; cursor: pointer; font-family: inherit; font-weight: 600; color: white;
        }
        .btn-approve { background: #10b981; }
        .btn-reject { background: #ef4444; }
        
        .loading { text-align: center; color: #ff5e62; font-weight: 600; margin-top: 15px;}
    </style>
</head>
<body>

<button class="admin-btn" onclick="loginAdmin()">🔑 ผู้ดูแลระบบ</button>

<!-- ตัวการ์ตูนตกแต่ง -->
<img src="https://cdn-icons-png.flaticon.com/512/2932/2932549.png" style="position:fixed; width:200px; bottom:20px; left:20px; z-index:0; animation: float 3s infinite alternate;" alt="cartoon">

<div class="container">
    <!-- กล่องฟอร์ม -->
    <div class="card">
        <h2>✨ ส่งคำขอยืม-คืน ✨</h2>
        
        <div class="form-group">
            <label>สถานะผู้ใช้งาน 👤</label>
            <select id="role">
                <option value="นักเรียน">👨‍🎓 นักเรียน</option>
                <option value="คุณครู">👨‍🏫 คุณครู</option>
            </select>
        </div>

        <div class="form-group">
            <label>รหัสประจำตัว 🏫</label>
            <input type="text" id="studentId" placeholder="ระบุรหัส 5 หลัก / รหัสครู" required>
        </div>
        
        <div class="form-group">
            <label>ชื่อ-นามสกุล 📝 <span style="font-size:0.85em; font-weight:400; color:#718096;">(เฉพาะยืม)</span></label>
            <input type="text" id="name" placeholder="ระบุชื่อ-นามสกุล">
        </div>
        
        <div class="form-group">
            <label>อุปกรณ์ 🔬</label>
            <select id="equipment">
                <option value="กล้องจุลทรรศน์">🔬 กล้องจุลทรรศน์</option>
                <option value="บีกเกอร์ 250ml">🧪 บีกเกอร์ 250ml</option>
                <option value="หลอดทดลอง">🌡️ หลอดทดลอง</option>
                <option value="เครื่องชั่งดิจิทัล">⚖️ เครื่องชั่งดิจิทัล</option>
            </select>
        </div>
        
        <div class="btn-group">
            <button class="action-btn btn-borrow" onclick="submitForm('borrow')">ขอยืมอุปกรณ์</button>
            <button class="action-btn btn-return" onclick="submitForm('return')">คืนอุปกรณ์</button>
        </div>
    </div>

    <!-- กล่องตาราง -->
    <div class="card">
        <h3>📋 สถานะอุปกรณ์</h3>
        
        <div class="tabs">
            <button class="tab-btn active" id="tab-active" onclick="switchTab('active')">กำลังยืม</button>
            <button class="tab-btn" id="tab-pending" onclick="switchTab('pending')">รออนุมัติ</button>
        </div>

        <div id="table-loading" class="loading">กำลังโหลดข้อมูล... ⏳</div>
        
        <div style="overflow-x: auto;">
            <table id="borrowed-table" style="display:none;">
                <thead>
                    <tr>
                        <th>ผู้ทำรายการ</th>
                        <th>อุปกรณ์</th>
                        <th>สถานะ</th>
                    </tr>
                </thead>
                <tbody id="borrowed-list"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz1x_iSOWvi7DzVS8JlPy-VD0b58yfD_QczyeF01lTucrmsQDlLYTzRTqjk7g7kpd7D/exec'; // 📌 ใส่ URL ตรงนี้
    
    let allData = [];
    let currentTab = 'active';
    let adminPin = null; // เก็บ PIN ชั่วคราวเมื่อล็อกอินผ่าน

    window.onload = loadData;

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-active').className = tab === 'active' ? 'tab-btn active' : 'tab-btn';
        document.getElementById('tab-pending').className = tab === 'pending' ? 'tab-btn active' : 'tab-btn';
        renderTable();
    }

    // ฟังก์ชันจัดการฟอร์ม (ยืม/คืน)
    function submitForm(action) {
        const role = document.getElementById('role').value;
        const studentId = document.getElementById('studentId').value;
        const name = document.getElementById('name').value;
        const equipment = document.getElementById('equipment').value;

        if (!studentId) return Swal.fire('แจ้งเตือน', 'กรุณากรอกรหัสประจำตัว', 'warning');
        if (action === 'borrow' && !name) return Swal.fire('แจ้งเตือน', 'กรุณากรอกชื่อ-นามสกุล', 'warning');

        Swal.fire({ title: 'กำลังประมวลผล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        let formData = new URLSearchParams();
        formData.append('action', action); formData.append('role', role);
        formData.append('studentId', studentId); formData.append('name', name);
        formData.append('equipment', equipment);

        fetch(scriptURL, { method: 'POST', body: formData })
        .then(res => res.text())
        .then(result => {
            if (result === 'Success_Pending') {
                Swal.fire('ส่งคำขอสำเร็จ!', 'คำขอยืมของคุณอยู่ในสถานะ "รออนุมัติ" กรุณารอครูผู้ดูแลอนุมัติ', 'success');
            } else if (result === 'Success_Return') {
                Swal.fire('คืนสำเร็จ!', 'รับคืนอุปกรณ์เรียบร้อยแล้ว ขอบคุณครับ', 'success');
            } else if (result === 'Not_Found') {
                Swal.fire('ไม่พบข้อมูล', 'ไม่พบอุปกรณ์ที่คุณกำลังยืมอยู่ หรือคืนไปแล้ว', 'error');
            }
            loadData();
        }).catch(() => Swal.fire('ผิดพลาด', 'ติดต่อเซิร์ฟเวอร์ไม่ได้', 'error'));
    }

    // โหลดข้อมูลทั้งหมด
    function loadData() {
        document.getElementById('table-loading').style.display = 'block';
        document.getElementById('borrowed-table').style.display = 'none';

        fetch(scriptURL).then(res => res.json()).then(data => {
            allData = data;
            renderTable();
            document.getElementById('table-loading').style.display = 'none';
            document.getElementById('borrowed-table').style.display = 'table';
        });
    }

    // เรนเดอร์ตารางตามแท็บที่เลือก
    function renderTable() {
        const tbody = document.getElementById('borrowed-list');
        tbody.innerHTML = ''; 
        
        let filteredData = allData.filter(item => 
            currentTab === 'active' ? item.status === 'กำลังยืม' : item.status === 'รออนุมัติ'
        );

        if (filteredData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#999; padding:30px;">ไม่มีข้อมูลในหมวดหมู่นี้</td></tr>`;
            return;
        }

        filteredData.forEach(item => {
            let badgeClass = item.status === 'กำลังยืม' ? 'badge-active' : 'badge-pending';
            let adminBtns = '';
            
            // ถ้าเข้าระบบ Admin และอยู่แท็บรออนุมัติ ให้โชว์ปุ่มอนุมัติ
            if (adminPin && item.status === 'รออนุมัติ') {
                adminBtns = `<div class="admin-controls" style="display:flex;">
                    <button class="btn-approve" onclick="adminAction('${item.txnId}', 'กำลังยืม')">✓ อนุมัติ</button>
                    <button class="btn-reject" onclick="adminAction('${item.txnId}', 'ไม่อนุมัติ')">✗ ปฏิเสธ</button>
                </div>`;
            }

            tbody.innerHTML += `<tr>
                <td><b>${item.studentId}</b> <span style="font-size:0.85em; color:#666;">(${item.role})</span><br>
                    <span style="font-size:0.9em; color:#718096;">${item.name}</span></td>
                <td><span style="color:#ff5e62; font-weight:500;">${item.equipment}</span><br>
                    <span style="font-size:0.8em; color:#999;">${item.date}</span></td>
                <td><span class="badge ${badgeClass}">${item.status}</span> ${adminBtns}</td>
            </tr>`;
        });
    }

   function loginAdmin() {
        if(adminPin) {
            Swal.fire({ title: 'ออกจากระบบไหม?', icon: 'question', showCancelButton: true })
            .then(res => { if(res.isConfirmed) { adminPin = null; renderTable(); Swal.fire('ออกจากระบบแล้ว','','success'); }});
            return;
        }

        Swal.fire({
            title: 'ใส่รหัสผ่านผู้ดูแลระบบ',
            input: 'password',
            inputAttributes: { autocapitalize: 'off' },
            showCancelButton: true,
            confirmButtonText: 'เข้าสู่ระบบ',
        }).then((result) => {
            if (result.isConfirmed) {
                // 👇 เพิ่มการตรวจสอบรหัสผ่านตรงนี้ 👇
                if (result.value === "123456") { 
                    adminPin = result.value;
                    Swal.fire({icon: 'success', title: 'เปิดโหมดผู้ดูแล', text: 'ไปที่แท็บ "รออนุมัติ" เพื่อจัดการคำขอ', timer: 2000, showConfirmButton:false});
                    switchTab('pending');
                } else {
                    // 👇 ถ้ารหัสผิด ให้แจ้งเตือน 👇
                    Swal.fire('รหัสผ่านไม่ถูกต้อง', 'กรุณาลองใหม่อีกครั้ง', 'error');
                }
                // 👆 สิ้นสุดส่วนที่แก้ไข 👆
            }
        });
    }

    // ฟังก์ชันจัดการของ Admin (ยิง POST ส่งสถานะใหม่)
    function adminAction(txnId, status) {
        Swal.fire({ title: 'กำลังบันทึก...', didOpen: () => Swal.showLoading() });
        let formData = new URLSearchParams();
        formData.append('action', 'admin_action');
        formData.append('pin', adminPin);
        formData.append('txnId', txnId);
        formData.append('status', status);

        fetch(scriptURL, { method: 'POST', body: formData }).then(res => res.text()).then(result => {
            if(result === 'Success_Admin') {
                Swal.fire('สำเร็จ', `อัปเดตเป็น "${status}" แล้ว`, 'success');
                loadData();
            } else if (result === 'Invalid_PIN') {
                adminPin = null; renderTable(); // ล้างรหัสออก
                Swal.fire('รหัสผ่านผิด', 'กรุณาเข้าสู่ระบบผู้ดูแลใหม่', 'error');
            }
        });
    }
</script>

</body>
</html>
