<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบยืม-คืนอุปกรณ์วิทยาศาสตร์</title>
    
    <!-- ฟอนต์ Prompt จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- SweetAlert2 สำหรับแจ้งเตือนแบบสวยงาม -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
            --accent-borrow: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --accent-return: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        body { 
            font-family: 'Prompt', sans-serif; 
            background: var(--primary-bg); 
            background-image: radial-gradient(circle at top right, #eef2f3 0%, #f8fafc 100%);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container { 
            max-width: 1000px; 
            width: 100%; 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 30px; 
        }

        @media (min-width: 768px) {
            .container {
                grid-template-columns: 400px 1fr;
            }
        }

        .card { 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 20px; 
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08); 
            border: 1px solid rgba(255,255,255,0.5);
        }

        h2, h3 { 
            text-align: left; 
            color: var(--text-main); 
            margin-top: 0; 
            font-weight: 600;
            margin-bottom: 25px;
        }

        h2 { font-size: 1.5rem; }
        h3 { font-size: 1.25rem; border-bottom: 2px solid var(--primary-bg); padding-bottom: 15px; }

        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--text-main); 
            font-size: 0.95em; 
            font-weight: 500;
        }

        input[type="text"], select { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1.5px solid var(--border-color); 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-family: 'Prompt', sans-serif;
            font-size: 0.95rem;
            background-color: var(--input-bg);
            transition: all 0.3s ease;
            color: var(--text-main);
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        
        button { 
            flex: 1; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            color: white; 
            font-weight: 500; 
            font-family: 'Prompt', sans-serif; 
            font-size: 1rem; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        button:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .btn-borrow { background: var(--accent-borrow); }
        .btn-return { background: var(--accent-return); }
        
        button:disabled { 
            opacity: 0.7; 
            cursor: not-allowed; 
            transform: none;
            box-shadow: none;
        }
        
        /* สไตล์ตารางพรีเมียม */
        .table-container {
            overflow-x: auto;
        }

        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0;
            margin-top: 10px; 
            font-size: 0.95em; 
        }
        
        th, td { 
            padding: 16px 12px; 
            text-align: left; 
            border-bottom: 1px solid var(--border-color);
        }
        
        th { 
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        td b { color: var(--text-main); font-weight: 500; }
        td span.student-name { color: var(--text-muted); font-size: 0.9em; display: block; margin-top: 4px; }
        
        tbody tr { transition: background-color 0.2s; }
        tbody tr:hover { background-color: var(--primary-bg); }

        .loading, .status-msg { 
            text-align: center; 
            margin-top: 20px; 
            font-weight: 500; 
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        
        .status-msg { color: #f59e0b; display: none; }
        .empty-row { text-align: center; color: var(--text-muted); padding: 40px !important; }
    </style>
</head>
<body>

<div class="container">
    <!-- ฝั่งซ้าย: ฟอร์มยืม-คืน -->
    <div class="card">
        <h2>🔬 จัดการยืม-คืนอุปกรณ์</h2>
        
        <div class="form-group">
            <label>รหัสนักเรียน</label>
            <input type="text" id="studentId" placeholder="ระบุรหัสนักเรียน 5 หลัก" required autocomplete="off">
        </div>
        
        <div class="form-group">
            <label>ชื่อ-นามสกุล <span style="color:var(--text-muted); font-weight:300; font-size:0.85em;">(เฉพาะตอนยืม)</span></label>
            <input type="text" id="name" placeholder="นาย/นางสาว..." autocomplete="off">
        </div>
        
        <div class="form-group">
            <label>เลือกอุปกรณ์</label>
            <select id="equipment">
                <option value="กล้องจุลทรรศน์">🔬 กล้องจุลทรรศน์</option>
                <option value="บีกเกอร์ 250ml">🧪 บีกเกอร์ 250ml</option>
                <option value="หลอดทดลอง">🌡️ หลอดทดลอง</option>
                <option value="เครื่องชั่งดิจิทัล">⚖️ เครื่องชั่งดิจิทัล</option>
            </select>
        </div>
        
        <div class="btn-group">
            <button class="btn-borrow" id="btn-borrow" onclick="submitForm('borrow')">ยืมอุปกรณ์</button>
            <button class="btn-return" id="btn-return" onclick="submitForm('return')">คืนอุปกรณ์</button>
        </div>
        
        <div id="status-msg" class="status-msg">กำลังประมวลผล โปรดรอสักครู่...</div>
    </div>

    <!-- ฝั่งขวา: ตารางแสดงรายการที่กำลังถูกยืม -->
    <div class="card">
        <h3>📋 อุปกรณ์ที่ยังไม่ได้รับคืน</h3>
        <div id="table-loading" class="loading">กำลังดึงข้อมูล...</div>
        
        <div class="table-container">
            <table id="borrowed-table" style="display:none;">
                <thead>
                    <tr>
                        <th>ข้อมูลผู้ยืม</th>
                        <th>อุปกรณ์</th>
                        <th>วันและเวลา</th>
                    </tr>
                </thead>
                <tbody id="borrowed-list">
                    <!-- ข้อมูลจะถูกดึงมาแสดงตรงนี้ -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // === นำ URL ของ Web App จาก Google Apps Script มาใส่ตรงนี้ ===
    const scriptURL = 'https://script.google.com/macros/s/AKfycbydrM6tL4dBHH7-nM4yFE-VTXb5IBeRNBGKZ63GhDZOFT7mV2R48-P5rbjyhUkaNRA/exec'; 

    window.onload = loadBorrowedItems;

    function submitForm(action) {
        const studentId = document.getElementById('studentId').value;
        const name = document.getElementById('name').value;
        const equipment = document.getElementById('equipment').value;

        if (!studentId) {
            return Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบ', text: 'กรุณาระบุรหัสนักเรียนก่อนทำรายการ', confirmButtonColor: '#3b82f6' });
        }
        if (action === 'borrow' && !name) {
            return Swal.fire({ icon: 'warning', title: 'ข้อมูลไม่ครบ', text: 'กรุณาระบุชื่อ-นามสกุลสำหรับการยืม', confirmButtonColor: '#3b82f6' });
        }

        toggleUI(true);

        let formData = new URLSearchParams();
        formData.append('action', action);
        formData.append('studentId', studentId);
        formData.append('name', name);
        formData.append('equipment', equipment);

        fetch(scriptURL, { method: 'POST', body: formData, headers: { 'Content-Type': 'application/x-www-form-urlencoded' }})
        .then(res => res.text())
        .then(result => {
            toggleUI(false);
            if (result === 'Success') {
                Swal.fire({
                    icon: 'success',
                    title: 'ทำรายการสำเร็จ',
                    text: action === 'borrow' ? 'บันทึกข้อมูลการยืมเข้าสู่ระบบแล้ว' : 'บันทึกการรับคืนอุปกรณ์เรียบร้อยแล้ว',
                    confirmButtonColor: '#10b981'
                });
                
                document.getElementById('studentId').value = '';
                document.getElementById('name').value = '';
                loadBorrowedItems(); 
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'ไม่พบรายการ',
                    text: 'ไม่พบข้อมูลการยืมของนักเรียนคนนี้ หรือมีการรับคืนไปก่อนหน้านี้แล้ว',
                    confirmButtonColor: '#ef4444'
                });
            }
        })
        .catch(err => {
            toggleUI(false);
            Swal.fire({
                icon: 'error',
                title: 'ข้อผิดพลาดเครือข่าย',
                text: 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง',
                confirmButtonColor: '#ef4444'
            });
        });
    }

    function loadBorrowedItems() {
        document.getElementById('table-loading').style.display = 'block';
        document.getElementById('borrowed-table').style.display = 'none';

        fetch(scriptURL)
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('borrowed-list');
            tbody.innerHTML = ''; 

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="empty-row">ยอดเยี่ยม! ขณะนี้ไม่มีอุปกรณ์ค้างชำรุดหรือถูกยืม</td></tr>';
            } else {
                data.forEach(item => {
                    let row = `<tr>
                        <td><b>${item.studentId}</b><span class="student-name">${item.name}</span></td>
                        <td>${item.equipment}</td>
                        <td style="color:var(--text-muted); font-size:0.9em;">${item.date}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            }
            
            document.getElementById('table-loading').style.display = 'none';
            document.getElementById('borrowed-table').style.display = 'table';
        })
        .catch(err => {
            document.getElementById('table-loading').innerText = 'ไม่สามารถดึงข้อมูลรายการได้ในขณะนี้';
        });
    }

    function toggleUI(isProcessing) {
        document.getElementById('btn-borrow').disabled = isProcessing;
        document.getElementById('btn-return').disabled = isProcessing;
        document.getElementById('status-msg').style.display = isProcessing ? 'block' : 'none';
    }
</script>

</body>
</html>
